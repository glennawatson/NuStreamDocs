name: SonarCloud
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
jobs:
  analyze:
    name: Build, test, and analyze
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Setup .NET Environment
      id: environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@main
      with:
        dotnet-versions: |
          10.0.x
          11.0.x
    - name: Begin Sonar analysis
      id: sonar-begin
      uses: glennawatson/actions-common/.github/actions/sonarcloud@main
      with:
        mode: begin
        project-key: glennawatson_NuStreamDocs
        organization: glennawatson
        version: ${{ steps.environment.outputs.version-semver2 }}
        exclusions: '**/tests/**,**/benchmarks/**,**/tools/**'
        coverage-exclusions: '**/tests/**,**/benchmarks/**,**/tools/**'
        cpd-exclusions: '**/tests/**,**/benchmarks/**,**/tools/**'
        test-exclusions: '**/tests/**,**/benchmarks/**,**/tools/**'
        working-directory: src
    - name: Build
      uses: glennawatson/actions-common/.github/actions/dotnet-build@main
      with:
        solution-file: NuStreamDocs.slnx
        create-packages: 'false'
    - name: Test with MTP coverage
      uses: glennawatson/actions-common/.github/actions/dotnet-test@main
      with:
        solution-file: NuStreamDocs.slnx
    - name: End Sonar analysis
      if: always() && steps.sonar-begin.outcome == 'success'
      uses: glennawatson/actions-common/.github/actions/sonarcloud@main
      with:
        mode: end
        project-key: glennawatson_NuStreamDocs
        working-directory: src
