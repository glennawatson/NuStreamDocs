name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: write
concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build and test
    uses: glennawatson/actions-common/.github/workflows/workflow-common-setup-and-build.yml@d1a1652f1d0e4ad7d2f77bda30b58f4b42ab0748 # main
    with:
      solutionFile: NuStreamDocs.slnx
      minverTagPrefix: 'v'
      minverMinimumMajorMinor: '1.0'
      minverAutoIncrement: 'minor'
      dotnetVersions: |
        10.0.x
        11.0.x
